[package]
name = "imaginify-core"
version = "1.1.0"
edition = "2021"
publish = false
description = "Imaginify image pipeline: decode, crop, resize, encode, safe output naming"

[dependencies]
anyhow = "1"
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
lcms2 = "6"
# Always compile Little CMS into the app. Without this, lcms2-sys links a
# system copy found via pkg-config (Homebrew on the macOS CI runners), and the
# shipped app fails to launch on Macs without it.
lcms2-sys = { version = "4", features = ["static"] }
mozjpeg = "0.10"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tiff = { version = "0.11", default-features = false }
walkdir = "2"
webp = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
png = "0.18"
serde_json = "1"
tempfile = "3"
