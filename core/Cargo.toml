[package]
name = "imaginify-core"
version = "1.0.1"
edition = "2021"
publish = false
description = "Imaginify image pipeline: decode, crop, resize, encode, safe output naming"

[dependencies]
anyhow = "1"
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
lcms2 = "6"
mozjpeg = "0.10"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
walkdir = "2"
webp = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
png = "0.18"
serde_json = "1"
tempfile = "3"
