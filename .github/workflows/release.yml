# ---------------------------------------------------------------------------
# Release workflow for Imaginify (Tauri 2: Rust back end, HTML/CSS/JS window).
#
# Adapted from the canonical JezPress plugin release.yml: same tag trigger, same
# version gate and the same security invariant, but the artefacts are desktop
# builds made on each OS (each platform builds natively) instead of a ZIP.
#
# SECURITY INVARIANT - do not undo:
#   Never interpolate ${{ ... }} into a `run:` block. GitHub substitutes those
#   into the shell script TEXT before bash parses it, and the release version is
#   derived from the git TAG, which may legally contain ; $ ` ( ). A crafted tag
#   would execute arbitrary commands with GITHUB_TOKEN in scope. Org members have
#   push (so can create tags) but not admin, so interpolation would hand them a
#   route to the token they are deliberately not trusted with. Pass every value
#   via `env:` and reference "$VAR" inside the script instead.
# ---------------------------------------------------------------------------
name: Release

# Two ways in:
#   - push an annotated tag `vX.Y.Z`  -> verify, build all platforms, publish the
#     GitHub release with every installer attached.
#   - "Run workflow" (workflow_dispatch) on a branch -> verify + build only. The
#     builds land as workflow artifacts for a hand install check before tagging
#     (/release step 5). Nothing is published.
#
# Built per release (assets, X.Y.Z = version):
#   Imaginify-Setup-X.Y.Z.exe               Windows installer wizard (Inno Setup;
#                                           same AppId as 1.0.x, so it upgrades in place)
#   Imaginify-X.Y.Z-windows-portable.exe    Windows app, no installation
#   Imaginify-X.Y.Z-macos-arm64.dmg         Apple Silicon
#   Imaginify-X.Y.Z-macos-x86_64.dmg        Intel Macs
#   SHA256SUMS.txt
#
# Nothing is signed or notarised (the macOS app is ad-hoc signed so Apple
# Silicon will run it): Windows SmartScreen and macOS Gatekeeper warn on first
# launch, and the release notes say how to get past it. No repo secrets needed.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not X.Y.Z"
            exit 1
          fi
          # Every version spot (Tauri config, Cargo manifests + lock, npm files,
          # Inno Setup script, version.json) and the newest CHANGELOG.md section
          # must equal the tag.
          python3 .claude/scripts/check_versions.py --expect "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION ($REF_TYPE $REF_NAME)"

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # NASM gives mozjpeg its SIMD code on x86_64 (without it, JPEG encoding still works, slower).
      - name: Install NASM and Inno Setup 6
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\NASM"
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Builds the app, copies it to dist\Imaginify.exe, fetches the WebView2
      # bootstrapper and compiles the installer. The .bat ends in `pause`;
      # stdin from NUL makes it return at once.
      - name: Build app + installer (build_installer_windows.bat)
        shell: cmd
        run: call build_installer_windows.bat < NUL

      - name: Stage assets
        shell: bash
        run: |
          mkdir -p out
          test -f dist/Imaginify.exe || { echo "::error::dist/Imaginify.exe was not built"; exit 1; }
          test -f "dist/Imaginify-Setup-$VERSION.exe" || { echo "::error::dist/Imaginify-Setup-$VERSION.exe was not built (installer_windows.iss version?)"; exit 1; }
          cp dist/Imaginify.exe "out/Imaginify-$VERSION-windows-portable.exe"
          cp "dist/Imaginify-Setup-$VERSION.exe" out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: imaginify-windows
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel. If GitHub retires this label, drop the row and say so in the release notes.
            arch: x86_64
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install NASM (Intel only)
        if: matrix.arch == 'x86_64'
        run: brew install nasm

      # Native build for the runner's own architecture: Imaginify.app (ad-hoc
      # signed, see tauri.conf.json) and a DMG.
      - name: Build app + DMG
        run: |
          npm ci
          npm run build:mac
          BIN=target/release/bundle/macos/Imaginify.app/Contents/MacOS/imaginify
          ARCHS="$(lipo -archs "$BIN")"
          echo "Binary architectures: $ARCHS"
          case " $ARCHS " in *" $ARCH "*) ;; *) echo "::error::built for '$ARCHS', expected $ARCH"; exit 1 ;; esac
          codesign --verify --verbose=1 target/release/bundle/macos/Imaginify.app
          # Only macOS system libraries may be linked: anything else (e.g. a
          # Homebrew dylib found on the runner) is missing on users' Macs and
          # the app would not launch.
          LIBS="$(otool -L "$BIN")"   # a failing otool aborts the step (bash -e)
          if printf '%s\n' "$LIBS" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::the app links a non-system library (listed above)"
            exit 1
          fi

      - name: Stage assets
        run: |
          mkdir -p out
          set -- target/release/bundle/dmg/*.dmg
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one DMG, found: $*"; exit 1; }
          cp "$1" "out/Imaginify-$VERSION-macos-$ARCH.dmg"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: imaginify-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error


  release:
    name: Publish GitHub release
    needs: [verify, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: imaginify-*
          path: assets
          merge-multiple: true

      - name: Check the asset set and write checksums
        run: |
          cd assets
          fail=0
          for f in "Imaginify-Setup-$VERSION.exe" \
                   "Imaginify-$VERSION-windows-portable.exe" \
                   "Imaginify-$VERSION-macos-arm64.dmg" \
                   "Imaginify-$VERSION-macos-x86_64.dmg"; do
            if [ ! -s "$f" ]; then echo "::error::missing asset $f"; fail=1; fi
          done
          [ "$fail" = 0 ] || { ls -l; exit 1; }
          sha256sum Imaginify-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            echo "## What's new"
            echo
            python3 .claude/scripts/check_versions.py --notes "$VERSION"
            echo
            echo "## Downloads"
            echo
            echo "### Windows 10 / 11 (64-bit)"
            echo
            echo "- **Imaginify-Setup-$VERSION.exe** - installer wizard (recommended): Start Menu entry, optional Desktop icon, uninstaller. Upgrades an existing Imaginify install in place, and installs Microsoft's WebView2 runtime if the PC does not have it yet."
            echo "- **Imaginify-$VERSION-windows-portable.exe** - the app on its own, no installation. Needs the WebView2 runtime (built into Windows 11 and up-to-date Windows 10)."
            echo
            echo "Both are unsigned. Windows SmartScreen warns on first run - click **More info -> Run anyway**."
            echo
            echo "### macOS 11 or later"
            echo
            echo "- Apple Silicon (M1 and later): **Imaginify-$VERSION-macos-arm64.dmg**"
            echo "- Intel Macs: **Imaginify-$VERSION-macos-x86_64.dmg**"
            echo
            echo "Open the DMG and drag Imaginify to Applications (this replaces an older version). Not notarised yet: on first launch, right-click the app -> **Open** -> **Open**."
            echo
            echo "Checksums: \`SHA256SUMS.txt\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" assets/* \
            --title "Imaginify $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
