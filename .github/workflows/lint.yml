name: Lint

# Every push and pull request: Rust format + clippy + the image-pipeline tests,
# the window's JavaScript, the helper scripts, and the version spots.
#
# Why: release.yml builds whatever is tagged, and an unsigned desktop app has no
# update channel to push a fix through quickly - a broken build reaches users as
# a download they keep. Catch it on the push, not on the tag.
#
# Adapted from the JezPress plugin lint.yml, including the file counts: a pass
# used to print nothing, which looked identical to linting zero files.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build dependencies (clippy compiles the app crate too),
      # plus NASM for mozjpeg's SIMD code.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev nasm

      # rust-toolchain.toml pins the compiler, clippy and rustfmt.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Image pipeline tests
        run: cargo test -p imaginify-core --locked

  ui:
    name: Window JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check
        run: |
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done < <(git ls-files 'ui/*.js')
          echo "Checked $count JavaScript files."
          [ "$count" -gt 0 ] || { echo "::error::No JavaScript files found."; exit 1; }

  scripts:
    name: Helper scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax (.claude/scripts)
        run: |
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            python3 -m py_compile "$f" || { echo "::error file=$f::py_compile failed"; exit 1; }
          done < <(git ls-files '*.py')
          echo "Compiled $count Python files."

      - name: bash -n + shellcheck (errors only)
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(git ls-files '*.sh')
          echo "Parsed $count shell scripts."
          [ "$count" -gt 0 ] || { echo "::error::No shell scripts found."; exit 1; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S error -f gcc || fail=1
          [ "$fail" -eq 0 ] || exit 1

  versions:
    # The version lives in the Tauri config, both Cargo manifests and Cargo.lock,
    # package.json / package-lock.json, installer_windows.iss and version.json,
    # and the newest CHANGELOG.md section must name it. A missed spot ships an
    # installer that disagrees with the app's title bar.
    name: Version spots agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_versions.py
        run: python3 .claude/scripts/check_versions.py
